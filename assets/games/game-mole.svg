<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <defs>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>
    <linearGradient id="moleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="360" height="130" rx="16" fill="url(#skyGrad)" />
  <!-- Clouds -->
  <path d="M40 50 Q55 35 70 50 Q85 40 100 50 L100 65 L40 65 Z" fill="#FFF" opacity="0.8" />
  <path d="M260 40 Q275 25 290 40 Q305 30 320 40 L320 55 L260 55 Z" fill="#FFF" opacity="0.8" />

  <!-- Grass Ground -->
  <rect y="110" width="360" height="150" rx="16" fill="url(#grassGrad)" />

  <!-- Mole Holes & Moles -->
  <!-- Hole 1 (Left) -->
  <ellipse cx="85" cy="155" rx="42" ry="16" fill="#3E2723" />
  <ellipse cx="85" cy="158" rx="36" ry="12" fill="#271815" />
  <!-- Mole 1 pop -->
  <g transform="translate(85, 125)" filter="url(#shadow)">
    <path d="M-22 25 C-22 -10 22 -10 22 25 Z" fill="url(#moleGrad)" />
    <!-- Eyes -->
    <ellipse cx="-8" cy="2" rx="3" ry="4" fill="#000" />
    <ellipse cx="8" cy="2" rx="3" ry="4" fill="#000" />
    <circle cx="-9" cy="0" r="1.2" fill="#FFF" />
    <circle cx="7" cy="0" r="1.2" fill="#FFF" />
    <!-- Snout & Nose -->
    <ellipse cx="0" cy="10" rx="9" ry="6" fill="#D7CCC8" />
    <ellipse cx="0" cy="8" rx="4.5" ry="3" fill="#D81B60" />
    <!-- Vowel Sign on Helmet -->
    <circle cx="0" cy="-14" r="13" fill="#FFCA28" stroke="#FF8F00" stroke-width="1.5" />
    <text x="0" y="-8" fill="#2E1F40" font-family="'Prompt', sans-serif" font-weight="700" font-size="14" text-anchor="middle">-ะ</text>
  </g>

  <!-- Hole 2 (Center - Main active) -->
  <ellipse cx="180" cy="175" rx="55" ry="20" fill="#3E2723" />
  <ellipse cx="180" cy="179" rx="46" ry="15" fill="#271815" />
  <!-- Center Mole with Happy Expression -->
  <g transform="translate(180, 130)" filter="url(#shadow)">
    <path d="M-30 35 C-30 -18 30 -18 30 35 Z" fill="url(#moleGrad)" />
    <!-- Cheeks -->
    <circle cx="-16" cy="14" r="6" fill="#FF8A80" opacity="0.5" />
    <circle cx="16" cy="14" r="6" fill="#FF8A80" opacity="0.5" />
    <!-- Eyes -->
    <ellipse cx="-10" cy="4" rx="4" ry="5.5" fill="#000" />
    <ellipse cx="10" cy="4" rx="4" ry="5.5" fill="#000" />
    <circle cx="-11" cy="2" r="1.5" fill="#FFF" />
    <circle cx="9" cy="2" r="1.5" fill="#FFF" />
    <!-- Snout & Big Pink Nose -->
    <ellipse cx="0" cy="13" rx="12" ry="8" fill="#D7CCC8" />
    <ellipse cx="0" cy="10" rx="6" ry="4" fill="#E91E63" />
    <!-- Smile & Teeth -->
    <path d="M-6 16 Q0 21 6 16" fill="none" stroke="#3E2723" stroke-width="1.8" />
    <rect x="-3" y="16" width="6" height="4" rx="1" fill="#FFF" />
    <!-- Big Vowel Target Sign -->
    <circle cx="0" cy="-22" r="17" fill="#FFEB3B" stroke="#F57F17" stroke-width="2.5" />
    <text x="0" y="-14" fill="#B71C1C" font-family="'Prompt', sans-serif" font-weight="800" font-size="20" text-anchor="middle">-า</text>
  </g>

  <!-- Squeaky Hammer Poised above Center Mole -->
  <g transform="translate(242, 95) rotate(-35)" filter="url(#shadow)">
    <!-- Handle -->
    <rect x="-5" y="0" width="10" height="65" rx="3" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5" />
    <!-- Squeaky Head (Red Toy Hammer) -->
    <rect x="-26" y="-18" width="52" height="26" rx="8" fill="#E53935" stroke="#B71C1C" stroke-width="2" />
    <rect x="-30" y="-14" width="8" height="18" rx="3" fill="#FFEB3B" />
    <rect x="22" y="-14" width="8" height="18" rx="3" fill="#FFEB3B" />
    <!-- Star impact sparkles -->
    <path d="M-36 -5 L-42 -12 L-34 -10 L-32 -18 L-28 -10 L-20 -12 L-26 -5 L-22 3 L-30 0 L-36 4 Z" fill="#FFD54F" />
  </g>

  <!-- Hole 3 (Right) -->
  <ellipse cx="280" cy="155" rx="42" ry="16" fill="#3E2723" />
  <ellipse cx="280" cy="158" rx="36" ry="12" fill="#271815" />
  <!-- Mole 3 pop -->
  <g transform="translate(280, 125)" filter="url(#shadow)">
    <path d="M-22 25 C-22 -10 22 -10 22 25 Z" fill="url(#moleGrad)" />
    <!-- Eyes -->
    <ellipse cx="-8" cy="2" rx="3" ry="4" fill="#000" />
    <ellipse cx="8" cy="2" rx="3" ry="4" fill="#000" />
    <circle cx="-9" cy="0" r="1.2" fill="#FFF" />
    <circle cx="7" cy="0" r="1.2" fill="#FFF" />
    <!-- Snout & Nose -->
    <ellipse cx="0" cy="10" rx="9" ry="6" fill="#D7CCC8" />
    <ellipse cx="0" cy="8" rx="4.5" ry="3" fill="#D81B60" />
    <!-- Vowel Sign on Helmet -->
    <circle cx="0" cy="-14" r="13" fill="#FFCA28" stroke="#FF8F00" stroke-width="1.5" />
    <text x="0" y="-8" fill="#2E1F40" font-family="'Prompt', sans-serif" font-weight="700" font-size="14" text-anchor="middle">เ-</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(180, 235)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1B5E20" stroke="#FFD54F" stroke-width="1.5" />
    <text x="0" y="5" fill="#FFE082" font-family="'Prompt', sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      🔨 เกมตีตัวตุ่น สระอะ สระอา สระอิ
    </text>
  </g>
</svg>
