<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skyFlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="60%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#E1F5FE" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>
    <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="360" height="260" rx="16" fill="url(#skyFlight)" />

  <!-- Speed Lines / Wind Streams -->
  <path d="M-20 60 L140 60" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.4" stroke-dasharray="16 8" />
  <path d="M-10 115 L200 115" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5" stroke-dasharray="24 12" />
  <path d="M30 170 L260 170" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.4" stroke-dasharray="20 10" />

  <!-- Fluffy White Clouds -->
  <g fill="#FFF" opacity="0.85">
    <ellipse cx="60" cy="210" rx="55" ry="30" />
    <ellipse cx="100" cy="195" rx="40" ry="25" />
    <ellipse cx="290" cy="70" rx="50" ry="28" />
    <ellipse cx="320" cy="85" rx="35" ry="20" />
  </g>

  <!-- Target Floating Word Cloud / Balloon (Target: "แม่น้ำ") -->
  <g transform="translate(265, 110)" filter="url(#shadow)">
    <!-- Balloon Body -->
    <ellipse cx="0" cy="0" rx="44" ry="48" fill="url(#balloonGrad)" stroke="#FFA000" stroke-width="2" />
    <polygon points="-8,48 8,48 0,58" fill="#FF8F00" />
    <text x="0" y="6" fill="#2E1F40" font-family="'Prompt', sans-serif" font-weight="800" font-size="18" text-anchor="middle">
      แม่น้ำ
    </text>
    <!-- Little basket below -->
    <line x1="-12" y1="52" x2="-6" y2="70" stroke="#795548" stroke-width="1.5" />
    <line x1="12" y1="52" x2="6" y2="70" stroke="#795548" stroke-width="1.5" />
    <rect x="-10" y="70" width="20" height="12" rx="2" fill="#8D6E63" />
  </g>

  <!-- Distractor Balloon (Top Left: "ภูเขา") -->
  <g transform="translate(195, 45)" filter="url(#shadow)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="30" ry="34" fill="#81C784" stroke="#43A047" stroke-width="1.5" />
    <text x="0" y="5" fill="#1B5E20" font-family="'Prompt', sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      ภูเขา
    </text>
  </g>

  <!-- Hero Airplane (Flying right towards target balloon) -->
  <g transform="translate(110, 130) rotate(-6)" filter="url(#shadow)">
    <!-- Jet Smoke Stream -->
    <path d="M-60 2 Q-75 -3 -95 0 Q-110 5 -125 2" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M-60 4 Q-80 6 -100 8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Fuselage Body -->
    <path d="M60 0 C60 14 30 18 -40 16 C-50 16 -55 12 -55 0 C-55 -12 -50 -16 -40 -16 C30 -18 60 -14 60 0 Z" fill="url(#planeGrad)" />

    <!-- Cockpit Glass Bubble -->
    <path d="M20 -14 C15 -25 35 -25 42 -14 Z" fill="#80D8FF" stroke="#0091EA" stroke-width="1.5" />
    <ellipse cx="28" cy="-17" rx="3" ry="1.5" fill="#FFF" />

    <!-- Pilot Chibi Goggles & Scarf -->
    <circle cx="26" cy="-14" r="5" fill="#FFE0B2" />
    <circle cx="28" cy="-15" r="2.5" fill="#5D4037" />
    <path d="M12 -12 L-4 -8 L-6 -12 Z" fill="#FFEB3B" />

    <!-- Main Wings -->
    <path d="M-5 -6 L-25 -42 L8 -42 L22 -6 Z" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5" />
    <path d="M-5 6 L-25 42 L8 42 L22 6 Z" fill="#B71C1C" stroke="#7F0000" stroke-width="1.5" />
    <rect x="-22" y="-40" width="28" height="4" fill="#FFEB3B" />
    <rect x="-22" y="36" width="28" height="4" fill="#FFEB3B" />

    <!-- Tail Fin -->
    <path d="M-42 -14 L-54 -36 L-38 -36 L-30 -14 Z" fill="#FF5252" />
    <!-- Thai Flag Stripe on Tail -->
    <rect x="-48" y="-32" width="10" height="2" fill="#D32F2F" />
    <rect x="-48" y="-30" width="10" height="2" fill="#FFFFFF" />
    <rect x="-48" y="-28" width="10" height="2" fill="#1976D2" />
    <rect x="-48" y="-26" width="10" height="2" fill="#FFFFFF" />
    <rect x="-48" y="-24" width="10" height="2" fill="#D32F2F" />

    <!-- Nose Propeller Hub & Blades -->
    <ellipse cx="60" cy="0" rx="3.5" ry="8" fill="#FFD54F" />
    <!-- Spinning motion blur of propeller -->
    <ellipse cx="62" cy="0" rx="3" ry="24" fill="#FFF" opacity="0.6" stroke="#FFD54F" stroke-width="1" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(180, 235)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#0D47A1" stroke="#FFD54F" stroke-width="1.5" />
    <text x="0" y="5" fill="#FFE082" font-family="'Prompt', sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      ✈️ เกมเครื่องบินเหินเวหาล่าคำศัพท์
    </text>
  </g>
</svg>
