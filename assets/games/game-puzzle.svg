<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <defs>
    <linearGradient id="puzzleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311B92" />
      <stop offset="100%" stop-color="#5E35B1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="360" height="260" rx="16" fill="url(#puzzleBg)" />

  <!-- Connecting Jigsaw Pieces -->
  <!-- Piece 1: Left Consonant "ป" (Coral Pink) -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <path d="M0 0 
             L65 0 
             C65 15 80 15 80 35 
             C80 55 65 55 65 70 
             L65 105 
             L0 105 
             Z" fill="#EC407A" stroke="#C2185B" stroke-width="2" />
    <text x="32" y="65" fill="#FFF" font-family="'Prompt', sans-serif" font-weight="800" font-size="36" text-anchor="middle">
      ป
    </text>
    <text x="32" y="92" fill="#FCE4EC" font-family="'Prompt', sans-serif" font-weight="500" font-size="11" text-anchor="middle">
      พยัญชนะต้น
    </text>
  </g>

  <!-- Piece 2: Middle Vowel "ล" + "า" (Amber Yellow) -->
  <g transform="translate(136, 60)" filter="url(#shadow)">
    <path d="M0 0 
             C0 15 15 15 15 35 
             C15 55 0 55 0 70 
             L0 105 
             L75 105 
             C75 90 90 90 90 70 
             C90 50 75 50 75 35 
             L75 0 
             Z" fill="#FFA726" stroke="#EF6C00" stroke-width="2" />
    <text x="42" y="65" fill="#2E1F40" font-family="'Prompt', sans-serif" font-weight="800" font-size="36" text-anchor="middle">
      ล
    </text>
    <text x="42" y="92" fill="#4E342E" font-family="'Prompt', sans-serif" font-weight="500" font-size="11" text-anchor="middle">
      ควบกล้ำ
    </text>
  </g>

  <!-- Piece 3: Right Vowel "า" (Teal Cyan) -->
  <g transform="translate(222, 60)" filter="url(#shadow)">
    <path d="M0 0 
             C0 15 15 15 15 35 
             C15 55 0 55 0 70 
             L0 105 
             L75 105 
             L75 0 
             Z" fill="#26A69A" stroke="#00695C" stroke-width="2" />
    <text x="38" y="65" fill="#FFF" font-family="'Prompt', sans-serif" font-weight="800" font-size="36" text-anchor="middle">
      -า
    </text>
    <text x="38" y="92" fill="#E0F2F1" font-family="'Prompt', sans-serif" font-weight="500" font-size="11" text-anchor="middle">
      สระอา
    </text>
  </g>

  <!-- Result Banner Below ("ป + ล + า = ปลา 🐟") -->
  <g transform="translate(180, 192)">
    <rect x="-105" y="-15" width="210" height="30" rx="8" fill="#FFF" filter="url(#shadow)" />
    <text x="0" y="6" fill="#1A237E" font-family="'Prompt', sans-serif" font-weight="700" font-size="15" text-anchor="middle">
      รวมเป็นคำ: <tspan fill="#C2185B" font-size="18">ปลา</tspan> 🐟
    </text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(180, 235)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1A237E" stroke="#FFE082" stroke-width="1.5" />
    <text x="0" y="5" fill="#FFE082" font-family="'Prompt', sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      🧩 เกมจับคู่ต่อภาพผสมคำ (Word Puzzle)
    </text>
  </g>
</svg>
