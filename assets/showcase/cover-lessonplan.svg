<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="100%" height="100%">
  <defs>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="50%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="bookShadow">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Book Base -->
  <rect x="10" y="10" width="260" height="360" rx="10" fill="url(#planGrad)" filter="url(#bookShadow)" />
  <rect x="10" y="10" width="18" height="360" rx="4" fill="rgba(0,0,0,0.22)" />
  <line x1="28" y1="10" x2="28" y2="370" stroke="url(#gold)" stroke-width="1.5" />

  <rect x="36" y="24" width="220" height="332" rx="6" fill="none" stroke="url(#gold)" stroke-width="2" />
  <rect x="42" y="30" width="208" height="320" rx="4" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Embellishment Top Crest (Document / Pencil / Plan) -->
  <circle cx="146" cy="72" r="28" fill="#FFF" opacity="0.95" />
  <!-- Notepad & Pencil Icon -->
  <rect x="135" y="56" width="18" height="26" rx="2" fill="#E91E63" />
  <line x1="139" y1="62" x2="149" y2="62" stroke="#FFF" stroke-width="1.5" />
  <line x1="139" y1="67" x2="149" y2="67" stroke="#FFF" stroke-width="1.5" />
  <line x1="139" y1="72" x2="147" y2="72" stroke="#FFF" stroke-width="1.5" />
  <path d="M152 75 L158 64 L162 66 L155 78 Z" fill="#FFC107" />

  <!-- Title Section -->
  <text x="146" y="128" fill="url(#gold)" font-family="'Prompt', sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="0.5">
    แผนการจัดการเรียนรู้
  </text>
  <text x="146" y="148" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-weight="600" font-size="12" text-anchor="middle">
    Active Learning เชิงรุก
  </text>
  <text x="146" y="166" fill="#F8BBD0" font-family="'Prompt', sans-serif" font-weight="400" font-size="10.5" text-anchor="middle">
    กลุ่มสาระการเรียนรู้ภาษาไทย ป.๑
  </text>

  <line x1="70" y1="184" x2="222" y2="184" stroke="url(#gold)" stroke-width="2" />

  <!-- Detail Box -->
  <rect x="52" y="200" width="188" height="110" rx="6" fill="rgba(255,255,255,0.12)" />
  <text x="146" y="222" fill="#FFE082" font-family="'Prompt', sans-serif" font-weight="600" font-size="13" text-anchor="middle">
    นางสาวศุทธินี ถาวร
  </text>
  <text x="146" y="242" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-weight="400" font-size="11" text-anchor="middle">
    ครู วิทยฐานะชำนาญการพิเศษ
  </text>
  <text x="146" y="260" fill="#F8BBD0" font-family="'Prompt', sans-serif" font-weight="400" font-size="10.5" text-anchor="middle">
    จัดการเรียนรู้ฐานสมรรถนะ
  </text>
  <text x="146" y="280" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-weight="500" font-size="10" text-anchor="middle">
    โรงเรียนชุมชนแม่ลาศึกษา
  </text>
  <text x="146" y="296" fill="#F48FB1" font-family="'Prompt', sans-serif" font-weight="400" font-size="9" text-anchor="middle">
    สพป.แม่ฮ่องสอน เขต ๒
  </text>

  <!-- Bottom Year Tag -->
  <rect x="96" y="322" width="100" height="22" rx="11" fill="url(#gold)" />
  <text x="146" y="337" fill="#880E4F" font-family="'Prompt', sans-serif" font-weight="700" font-size="11" text-anchor="middle">
    ปีการศึกษา 2567
  </text>
</svg>
