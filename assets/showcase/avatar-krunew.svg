<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6CC4" />
      <stop offset="50%" stop-color="#A986DE" />
      <stop offset="100%" stop-color="#E7DCFF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="khakiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4D3B8" />
      <stop offset="100%" stop-color="#C7B291" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEFE5" />
      <stop offset="100%" stop-color="#FED7C3" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#57407F" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <circle cx="160" cy="160" r="142" fill="#FFFFFF" opacity="0.15" />
  <circle cx="160" cy="160" r="136" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 4" />

  <!-- Background Aura Stars -->
  <path d="M70 65 L73 75 L83 78 L73 81 L70 91 L67 81 L57 78 L67 75 Z" fill="#FFE082" opacity="0.8" />
  <path d="M255 75 L257 83 L265 85 L257 87 L255 95 L253 87 L245 85 L253 83 Z" fill="#FFE082" opacity="0.8" />
  <path d="M260 210 L262 216 L268 218 L262 220 L260 226 L258 220 L252 218 L258 216 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Clip Path for Body & Bust -->
  <clipPath id="avatarClip">
    <circle cx="160" cy="160" r="142" />
  </clipPath>

  <g clip-path="url(#avatarClip)">
    <!-- Shoulders & Khaki Official Uniform -->
    <!-- Back Hair -->
    <path d="M100 120 C90 180 85 240 85 270 C105 275 125 280 160 280 C195 280 215 275 235 270 C235 240 230 180 220 120 Z" fill="#2C243B" />

    <!-- Uniform Torso -->
    <path d="M70 330 L75 245 C80 225 110 210 160 210 C210 210 240 225 245 245 L250 330 Z" fill="url(#khakiGrad)" />
    <!-- Collar Left -->
    <path d="M160 235 L125 205 L115 242 L145 258 Z" fill="#D8C4A5" stroke="#B8A382" stroke-width="1.5" />
    <!-- Collar Right -->
    <path d="M160 235 L195 205 L205 242 L175 258 Z" fill="#D8C4A5" stroke="#B8A382" stroke-width="1.5" />
    <!-- Tie / Inner Shirt V-neck -->
    <path d="M145 210 L160 238 L175 210 Z" fill="#FFF8F0" />
    
    <!-- Epaulets (อินทรธนู ชำนาญการพิเศษ ทองคำ) -->
    <!-- Left Epaulet -->
    <g transform="translate(85, 218) rotate(-15)">
      <rect x="0" y="0" width="38" height="15" rx="3" fill="url(#goldGrad)" stroke="#C59B27" stroke-width="1" />
      <circle cx="8" cy="7.5" r="4" fill="#FFE082" />
      <line x1="18" y1="3" x2="18" y2="12" stroke="#8D6E1A" stroke-width="2" />
      <line x1="26" y1="3" x2="26" y2="12" stroke="#8D6E1A" stroke-width="2" />
      <line x1="33" y1="3" x2="33" y2="12" stroke="#8D6E1A" stroke-width="2" />
    </g>
    <!-- Right Epaulet -->
    <g transform="translate(195, 210) rotate(15)">
      <rect x="0" y="0" width="38" height="15" rx="3" fill="url(#goldGrad)" stroke="#C59B27" stroke-width="1" />
      <circle cx="30" cy="7.5" r="4" fill="#FFE082" />
      <line x1="6" y1="3" x2="6" y2="12" stroke="#8D6E1A" stroke-width="2" />
      <line x1="13" y1="3" x2="13" y2="12" stroke="#8D6E1A" stroke-width="2" />
      <line x1="20" y1="3" x2="20" y2="12" stroke="#8D6E1A" stroke-width="2" />
    </g>

    <!-- Official Ribbon Bar (แพรแถบเหรียญราชการ) on Left Chest -->
    <g transform="translate(112, 260)">
      <rect x="0" y="0" width="34" height="10" rx="1.5" fill="#E53935" stroke="#B71C1C" stroke-width="0.8" />
      <rect x="6" y="0" width="6" height="10" fill="#1E88E5" />
      <rect x="17" y="0" width="6" height="10" fill="#FDD835" />
      <rect x="28" y="0" width="6" height="10" fill="#43A047" />
    </g>

    <!-- Name Plate (ป้ายชื่อข้าราชการ) on Right Chest -->
    <g transform="translate(174, 260)">
      <rect x="0" y="0" width="34" height="9" rx="1.5" fill="#1B1724" stroke="url(#goldGrad)" stroke-width="1" />
      <line x1="4" y1="4.5" x2="30" y2="4.5" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 2" />
    </g>

    <!-- Center Buttons -->
    <circle cx="160" cy="275" r="3.5" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1" />
    <circle cx="160" cy="305" r="3.5" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1" />

    <!-- Neck -->
    <path d="M142 170 L142 215 C148 220 172 220 178 215 L178 170 Z" fill="url(#skinGrad)" />
    <!-- Neck shadow -->
    <path d="M142 172 C152 188 168 188 178 172 L178 184 C168 196 152 196 142 184 Z" fill="#EDBFA8" />

    <!-- Head & Face -->
    <ellipse cx="160" cy="140" rx="46" ry="52" fill="url(#skinGrad)" />

    <!-- Soft Cheeks Blush -->
    <ellipse cx="132" cy="148" rx="9" ry="5.5" fill="#FF8A80" opacity="0.38" />
    <ellipse cx="188" cy="148" rx="9" ry="5.5" fill="#FF8A80" opacity="0.38" />

    <!-- Cute & Friendly Eyes -->
    <!-- Left Eye -->
    <g transform="translate(133, 134)">
      <ellipse cx="0" cy="0" rx="7.5" ry="8.5" fill="#2E203C" />
      <circle cx="-2.5" cy="-2.5" r="3.2" fill="#FFFFFF" />
      <circle cx="2.5" cy="3" r="1.3" fill="#FFFFFF" />
      <!-- Eyelash / Brow -->
      <path d="M-9 -8 C-4 -14 6 -13 9 -9" fill="none" stroke="#3A284C" stroke-width="2.2" stroke-linecap="round" />
    </g>
    <!-- Right Eye -->
    <g transform="translate(187, 134)">
      <ellipse cx="0" cy="0" rx="7.5" ry="8.5" fill="#2E203C" />
      <circle cx="-2.5" cy="-2.5" r="3.2" fill="#FFFFFF" />
      <circle cx="2.5" cy="3" r="1.3" fill="#FFFFFF" />
      <!-- Eyelash / Brow -->
      <path d="M-9 -9 C-6 -13 4 -14 9 -8" fill="none" stroke="#3A284C" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Warm Smiling Mouth -->
    <path d="M150 156 C155 165 165 165 170 156" fill="none" stroke="#C24153" stroke-width="2.5" stroke-linecap="round" />
    <!-- Cute Lip Gloss -->
    <path d="M153 158 C158 162 162 162 167 158" fill="none" stroke="#FF8DA1" stroke-width="1.5" />

    <!-- Nose -->
    <path d="M159 144 C161 146 162 147 160 148" fill="none" stroke="#DF9B81" stroke-width="1.8" stroke-linecap="round" />

    <!-- Cute Eyeglasses (Rose Gold/Purple Frame) -->
    <g stroke="#9C27B0" stroke-width="2.4" fill="rgba(255,255,255,0.22)">
      <!-- Left Rim -->
      <rect x="120" y="122" width="26" height="23" rx="8" />
      <!-- Right Rim -->
      <rect x="174" y="122" width="26" height="23" rx="8" />
      <!-- Bridge -->
      <path d="M146 131 C154 128 166 128 174 131" fill="none" />
      <!-- Temples -->
      <path d="M120 131 L112 129" fill="none" />
      <path d="M200 131 L208 129" fill="none" />
    </g>

    <!-- Front Hair & Bangs -->
    <path d="M112 125 C110 88 135 72 160 72 C190 72 210 88 208 125 C200 102 185 96 168 96 C148 96 125 106 112 125 Z" fill="#3D2B52" />
    <!-- Side Fringe Left -->
    <path d="M116 110 C110 130 114 155 116 168 C122 145 125 125 126 112 Z" fill="#2E1F40" />
    <!-- Side Fringe Right -->
    <path d="M204 110 C210 130 206 155 204 168 C198 145 195 125 194 112 Z" fill="#2E1F40" />
    <!-- Hair Highlights -->
    <path d="M135 84 C148 80 172 80 185 84" fill="none" stroke="#7A569E" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Floral Hair Accessory (Purple Orchid / Dok Mok) -->
    <g transform="translate(198, 92)">
      <circle cx="0" cy="0" r="8" fill="#E1BEE7" />
      <circle cx="-5" cy="-4" r="6" fill="#CE93D8" />
      <circle cx="5" cy="-4" r="6" fill="#CE93D8" />
      <circle cx="-5" cy="5" r="6" fill="#BA68C8" />
      <circle cx="5" cy="5" r="6" fill="#BA68C8" />
      <circle cx="0" cy="0" r="4.5" fill="#FFE082" />
    </g>
  </g>

  <!-- Bottom Gold Banner / Seal Badge -->
  <g transform="translate(160, 290)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#2E1F40" stroke="url(#goldGrad)" stroke-width="2" filter="url(#softShadow)" />
    <text x="0" y="5" font-family="'Prompt', sans-serif" font-size="12" font-weight="700" fill="#FFE082" text-anchor="middle" letter-spacing="0.5">
      ครูชำนาญการพิเศษ
    </text>
  </g>
</svg>
